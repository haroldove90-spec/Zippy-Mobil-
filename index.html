
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zippy Taxi</title>
    <meta name="description" content="Zippy Taxi - El Taxi que va contigo. Viajes justos y seguros." />
    <meta property="og:title" content="Zippy Taxi" />
    <meta property="og:description" content="El Taxi que va contigo - Viajes justos y seguros." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="https://daloocomercializadora.com.mx/zippyicono.png">
    <link rel="apple-touch-icon" href="https://daloocomercializadora.com.mx/zippyicono.png">
    
    <!-- Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA4X4KpoFvLTb5cDBcC1WgR-32vrnsjHnY&libraries=places,geometry,marker"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --zippy-main: #F5B901;
        --zippy-dark: #000000;
        --zippy-light: #005EDD;
        --zippy-accent: #F5B901;
        --zippy-blue: #005EDD;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #F9FAFB;
        color: var(--zippy-dark);
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }
      .zippy-shadow {
        box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.2);
      }
      .glass-morphism {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .ios-shadow {
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0, 94, 221, 0.35); border-radius: 9999px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0, 94, 221, 0.6); }
    </style>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              zippy: {
                main: 'var(--zippy-main)',
                dark: 'var(--zippy-dark)',
                light: 'var(--zippy-light)',
                accent: 'var(--zippy-accent)',
                blue: 'var(--zippy-blue)',
              }
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
